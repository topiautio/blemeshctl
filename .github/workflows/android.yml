name: Android app

on:
  pull_request:
    paths:
      - "android/**"
      - "examples/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  # Official checksum of gradle-9.8.1-wrapper.jar from services.gradle.org.
  GRADLE_WRAPPER_SHA256: 3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98
  APK_NAME: ${{ startsWith(github.ref, 'refs/tags/android-v') && 'blemeshctl-android-release.apk' || 'blemeshctl-android-debug.apk' }}

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the runner's Java 21
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" > /dev/null
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Verify the Gradle wrapper
        run: echo "$GRADLE_WRAPPER_SHA256  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p dist
          mv app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BLEMESHCTL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BLEMESHCTL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BLEMESHCTL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 BLEMESHCTL_KEYSTORE_PASSWORD BLEMESHCTL_KEY_ALIAS BLEMESHCTL_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Release signing secrets are missing; see the Android section of README.md"
              exit 1
            fi
          done
          export BLEMESHCTL_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$BLEMESHCTL_KEYSTORE_FILE"
          trap 'rm -f "$BLEMESHCTL_KEYSTORE_FILE"' EXIT
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          mv app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"

      - name: Verify release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          apk="dist/$APK_NAME"
          version="${GITHUB_REF_NAME#android-v}"
          badging="$("$BUILD_TOOLS/aapt2" dump badging "$apk")"
          grep -q "versionName='$version'" <<< "$badging" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match the app versionName in android/app/build.gradle.kts"
            exit 1
          }
          if grep -q "application-debuggable" <<< "$badging"; then
            echo "::error::Release APK is debuggable"
            exit 1
          fi
          "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the APK checksum
        run: sha256sum "dist/$APK_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: android/dist/${{ env.APK_NAME }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release asset
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: release
          digest-mismatch: error

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          asset="release/blemeshctl-android-$version.apk"
          mv "release/$APK_NAME" "$asset"
          sha256sum "$asset" | tee -a "$GITHUB_STEP_SUMMARY"
          # --latest=false keeps releases/latest pointing at the Linux executable.
          gh release create "$GITHUB_REF_NAME" \
            "$asset#Android APK" \
            --verify-tag \
            --latest=false \
            --title "Android app $version" \
            --notes-file - \
            --repo "$GITHUB_REPOSITORY" <<'NOTES'
          Android app for controlling legacy Telink BleMesh lights directly over Bluetooth LE.
          It sends only normal on, off, and RGB commands, and runs `.blemesh` scripts while the app is open.

          Install by opening the APK on the phone and allowing installs from that source.
          If a build signed with a different key is already installed, uninstall it first;
          Android refuses to update an app across signing keys. Uninstalling clears the app's saved
          light, mesh credentials, and script.
          NOTES
